version: '3.8'

services:
  db:
    image: postgres:15
    container_name: smartsort_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: smartsort_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    environment:
      - DATABASE_URL=postgresql://postgres:password@db:5432/smartsort_db
    depends_on:
      - db
    
  nginx:
    image: nginx:latest
    container_name: smartsort_proxy
    ports:
      - "8081:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api

volumes:
  postgres_data: